<div class="celebration-wrapper">
  
  <div class="content-main">
    <div class="fire-icon-container">
      <span class="material-symbols-outlined fire-icon">local_fire_department</span>
      <div class="fire-shadow"></div>
    </div>

    <h1 class="streak-number">{{ streakCount }}</h1>
    <h2 class="streak-label">días de racha</h2>

    <div class="week-calendar">
      @for (day of weekDays; track day.name) {
        <div class="day-col">
          <span class="day-name" [class.active]="day.status === 'current'">{{ day.name }}</span>
          
          <div class="day-circle" [class]="day.status">
            <span class="material-symbols-outlined check-icon">check</span>
          </div>
        </div>
      }
    </div>

    <p class="motivation-text">
       ¡Extendiste tu racha como el <strong>ganador</strong> con una AMP que sos!
    </p>
  </div>

  <div class="action-footer">
    <button class="btn-continue" routerLink="/home">CONTINUAR</button>
  </div>

</div>
