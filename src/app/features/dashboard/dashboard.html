<div class="dashboard-viewport">
  <main class="bento-grid">
    @if(this.ritualStreak()!){
    <div class="bento-card span-2">
      <app-streak-card [streakValue]="this.ritualStreak()!.CurrentStreak"
        [streakLabel]="this.ritualStreak()!.HabitName" />
    </div>
    }
    @if (todayRitual()!) {

    <div class="bento-card span-2">
      <app-ritual-accordion [ritual]="todayRitual()!" />
    </div>
    }
    <div class="bento-card span-2">
      <app-sessions-accordion [sessions]="this.focusmateSessions()!" />

    </div>
  </main>
  <app-navbar />
</div>
