<div #ritualModal class="m3-dialog" aria-labelledby="dialog-title">
  <div class="m3-dialog-surface">
    
    <h2 id="dialog-title" class="m3-dialog-headline">El Ritual del Ganador</h2>

    <div class="m3-dialog-content">
      @if (successMessage()) {
        <div class="success-banner" role="alert">
          {{ successMessage() }}
        </div>
      } @else {
        <form (ngSubmit)="onSubmit()" id="ritual-form">
          
          <div class="m3-text-field">
            <input 
              id="agradecimiento" 
              type="text" 
              [formField]="ritualForm.grateful_for" 
              aria-required="true"
              placeholder=" " 
            />
            <label for="agradecimiento">¿Por qué estás agradecido hoy?</label>
          </div>

          <h3 class="m3-dialog-subhead">Tus 10 Metas</h3>
          
          <div class="metas-container">
            @for (meta of ritual().goals; track $index) {
              <div class="m3-text-field">
                <input 
                  type="text"
                  id="meta-{{ $index }}"
                  [ngModel]="meta"
                  (ngModelChange)="actualizarMeta($index, $event)"
                  name="meta-{{ $index }}"
                  placeholder=" " 
                />
                <label for="meta-{{ $index }}">Meta {{ $index + 1 }}</label>
              </div>
            }
          </div>
        </form>
      }
    </div>

    <div class="m3-dialog-actions">
      <button type="button" class="m3-button-text">
        Cancelar
      </button>
      <button 
        type="submit" 
        form="ritual-form" 
        class="m3-button-filled" 
        [disabled]="!ritualForm().valid()">
        Forjar Disciplina
      </button>
    </div>
    
  </div>
</div>
