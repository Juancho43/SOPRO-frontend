@let ritual = this.ritual();
@if(ritual){
<div class="bento-card accordion-wrapper" [class.expanded]="isExpanded()">

    <button class="accordion-header" (click)="toggle()" aria-expanded="isExpanded()">
        <div class="header-title">
            <span class="material-symbols-outlined icon-accent">flag</span>
            <h3>Mis 10 Metas</h3>
        </div>
        <span class="material-symbols-outlined chevron-icon">
            expand_more
        </span>
    </button>
    <div class="accordion-body">
        <div class="accordion-content">
            <p> {{ritual.grateful_for}}</p>
            <ol class="md3-list">
                @for (item of ritual.goals; track $index) {

                <li class="md3-list-item">{{item}}</li>
                }
            </ol>
        </div>
    </div>

</div>
}
